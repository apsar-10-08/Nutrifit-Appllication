name: nutrifit
description: NutriFit - Your Health, Your Care. Complete Flutter + Supabase mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.14.1
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/dashboard/
    - assets/images/budget_products/
    - assets/images/stretching/
    - assets/images/stretching/male/
    - assets/images/stretching/female/
    - assets/images/workouts/
    - assets/images/shop/gnc/
    - assets/images/shop/muscleblaze/
    - assets/images/shop/youwefit/
    - assets/images/product_gnc.png
    - assets/images/product_mb.png
    - assets/images/product_ywf.png
    - assets/data/
