name: Selenium Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-selenium-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
          
      - name: Generate Realistic Selenium Tests
        run: python generate_realistic_selenium_tests.py
        
      - name: Upload Selenium Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Selenium_Test_Report
          path: testing-reports/Selenium_Test_Report.xlsx
          retention-days: 90
          if-no-files-found: error
