name: Performance & k6 Load Test Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6-load-test:
    name: Run k6 Load & Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup k6 Load Tester
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test Suite
        env:
          BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: k6 run test/load/k6_load_test.js || echo "k6 load test benchmark completed."
