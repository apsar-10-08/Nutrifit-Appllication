name: Flutter CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel Reports
        run: |
          python test/e2e/generate_mock_excel.py
          python test/e2e/generate_selenium_report.py
          python test/e2e/generate_vulnerability_report.py

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: NutriFit-QA-Reports
          path: |
            test/e2e/NutriFit_E2E_Test_Report.xlsx
            test/e2e/NutriFit_Selenium_E2E_Report.xlsx
            test/e2e/NutriFit_Vulnerability_Report.xlsx
