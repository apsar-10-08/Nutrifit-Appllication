name: Full Automatic Testing & QA Suite Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  auto-testing:
    name: Full Automatic Testing, Analysis & QA Suite
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1: Checkout Code
        uses: actions/checkout@v4

      - name: Stage 2: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Stage 3: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Stage 4: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Stage 5: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Stage 6: Create .env Configuration File
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          fi

      - name: Stage 7: Install Flutter Dependencies
        run: flutter pub get

      - name: Stage 8: Run Flutter Static Analysis
        run: flutter analyze --no-fatal-infos || echo "Static analysis finished with warnings."

      - name: Stage 9: Run Unit & Integration Tests (With Auto-Retry)
        run: |
          flutter test || (echo "Retrying flutter test..." && flutter test)

      - name: Stage 10: Generate QA Test Cases (380+ Cases) & Reports
        run: python test/generate_qa_suite.py

      - name: Stage 11: Publish GHA Execution Summary
        if: always()
        run: |
          if [ -f test-report.md ]; then
            cat test-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Stage 12: Upload QA Test Cases & Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NutriFit-Full-QA-Reports
          path: |
            test-cases.xlsx
            test-report.md
            code-quality-report.md
          retention-days: 30
